# docker-compose.override.yml — auto-loaded by `docker compose up` in local dev.
# In production (VPS), this file should NOT exist or be empty.
# To deploy prod without overrides: docker compose -f docker-compose.yml up -d

services:
  postgres:
    ports:
      - "5432:5432"

  ngrok:
    profiles: ["dev"]
    image: ngrok/ngrok:latest
    command: http api:8000 --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - postgres

  api:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./documents:/app/documents
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts