services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16  # pinned; 0.9.x not yet released
    environment:
      POSTGRES_USER: ragbot
      POSTGRES_PASSWORD: ragbot
      POSTGRES_DB: ragbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - app

  api:
    build: .
    # --timeout-keep-alive 120: document uploads with contextual retrieval can take 60+s
    command: sh -c "alembic upgrade head && uvicorn src.main:app --workers 1 --host 0.0.0.0 --port 8000 --timeout-keep-alive 120"
    env_file: .env
    volumes:
      - ./sp-diagnostico-histologico.md:/app/sp-diagnostico-histologico.md:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:8000:8000"
    networks:
      - app
    labels:
      - traefik.enable=true
      - traefik.http.routers.ragbot.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.ragbot.entrypoints=websecure
      - traefik.http.routers.ragbot.tls=true
      - traefik.http.routers.ragbot.tls.certresolver=letsencrypt
      - traefik.http.routers.ragbot.service=ragbot
      - traefik.http.services.ragbot.loadbalancer.server.port=8000
      - traefik.http.services.ragbot.loadbalancer.server.scheme=http
      # Separate upload router with longer response timeout (contextual retrieval: 60+s)
      - traefik.http.routers.ragbot_upload.rule=Host(`${TRAEFIK_HOST}`) && (PathPrefix(`/upload`) || PathPrefix(`/admin/`))
      - traefik.http.routers.ragbot_upload.entrypoints=websecure
      - traefik.http.routers.ragbot_upload.tls=true
      - traefik.http.routers.ragbot_upload.tls.certresolver=letsencrypt
      - traefik.http.routers.ragbot_upload.service=ragbot_upload
      - traefik.http.services.ragbot_upload.loadbalancer.server.port=8000
      - traefik.http.services.ragbot_upload.loadbalancer.server.scheme=http

volumes:
  pgdata:

networks:
  app: