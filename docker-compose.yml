services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragbot
      POSTGRES_PASSWORD: ragbot
      POSTGRES_DB: ragbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - app

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn src.main:app --workers 1 --host 0.0.0.0 --port 8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app
    labels:
      - traefik.enable=true
      - traefik.http.routers.ragbot.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.ragbot.entrypoints=websecure
      - traefik.http.routers.ragbot.tls=true
      - traefik.http.routers.ragbot.tls.certresolver=letsencrypt
      - traefik.http.services.ragbot.loadbalancer.server.port=8000

volumes:
  pgdata:

networks:
  app: