services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragbot
      POSTGRES_PASSWORD: ragbot
      POSTGRES_DB: ragbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./documents:/app/documents

  bot:
    build: .
    command: python src/bot.py
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
