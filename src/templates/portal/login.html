{% extends "portal/base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="login-container">
  <h1>Iniciar sesión</h1>

  {% if error %}
  <div class="alert err">{{ error }}</div>
  {% endif %}

  <form method="post" action="/portal/login">
    <div class="field">
      <label for="slug">Identificador del negocio</label>
      <input type="text" id="slug" name="slug" required autocomplete="username"
             placeholder="ej: mi-negocio" value="{{ slug|default('') }}">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required
             autocomplete="current-password" placeholder="Tu contraseña del portal">
    </div>
    <button type="submit" class="btn">Entrar</button>
  </form>
</div>
{% endblock %}
